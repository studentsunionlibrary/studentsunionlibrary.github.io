<span class="eyebrow">Notice Board</span>
<h1>Library notices</h1>
<p>Important announcements and updates from the library.</p>

<section class="section"><div class="wrap">
<div id="noticeList" class="grid-2"></div>
</div></section>

<footer><div class="wrap foot"><img src="library-logo.png" alt=""><div><b>Student's Union Library & Recreation Centre</b><br><small>Poonthura · Reg. No. 01/TVM/3952</small></div><small>© <span data-year></span></small></div></footer>
<script src="site.js"></script>
<script>
const box = document.getElementById('noticeList');

box.textContent = 'Loading notices...';

fetch('https://sularc1985.pythonanywhere.com/api/public/notices')
  .then(response => {
    if (!response.ok) throw new Error('Unable to load notices');
    return response.json();
  })
  .then(data => {
    box.replaceChildren();

    const notices = data.notices || [];

    if (!notices.length) {
      const message = document.createElement('p');
      message.textContent = 'No published notices at present.';
      box.appendChild(message);
      return;
    }

    notices.forEach(n => {
      const article = document.createElement('article');
      article.className = 'notice';

      const category = document.createElement('span');
      category.className = 'badge';
      category.textContent = n.category || 'Notice';

      const title = document.createElement('h3');
      title.textContent = n.title || n.title_ml || '';

      const date = document.createElement('small');
      date.textContent = n.notice_date || '';

      const body = document.createElement('p');
      body.textContent = n.body || '';

      article.append(category, title);

      if (n.title_ml && n.title_ml !== n.title) {
        const malayalamTitle = document.createElement('h4');
        malayalamTitle.textContent = n.title_ml;
        article.appendChild(malayalamTitle);
      }

      article.appendChild(date);

      if (n.body) article.appendChild(body);

      if (n.body_ml) {
        const malayalamBody = document.createElement('p');
        malayalamBody.textContent = n.body_ml;
        article.appendChild(malayalamBody);
      }

      box.appendChild(article);
    });
  })
  .catch(() => {
    box.textContent = 'Notices could not be loaded. Please try again later.';
  });
</script>
